name: Timevarsel for hallregistrering

on:
  schedule:
    # Kjører hver time, på hele timen (UTC). Selve scriptene regner om til
    # norsk tid (Europe/Oslo) og gjør bare noe når klokka faktisk er et av de
    # planlagte registreringstidspunktene (varsel) eller midnatt (nullstill vakt).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      tving_varsel:
        description: "Send et test-varsel nå, uavhengig av klokkeslett (ja/nei)"
        required: false
        default: "nei"
      tving_reset:
        description: "Nullstill vaktstatus nå (test), uavhengig av klokkeslett (ja/nei)"
        required: false
        default: "nei"

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repoet
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer avhengigheter
        run: npm install

      - name: Skriv Firebase-nøkkel til fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      - name: Send varsel hvis det er riktig tidspunkt
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
          TVING_VARSEL: ${{ github.event.inputs.tving_varsel == 'ja' && 'true' || 'false' }}
        run: node send-reminder.js

      - name: Nullstill vaktstatus til rødt hvis det er midnatt
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
          TVING_RESET: ${{ github.event.inputs.tving_reset == 'ja' && 'true' || 'false' }}
        run: node reset-vakt.js

      - name: Slett nøkkelfilen
        if: always()
        run: rm -f service-account.json
